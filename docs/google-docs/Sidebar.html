/* Offizin panel. Shared by the Word task pane, the Google Docs sidebar, and the website demo.
   Designed to work from 280 pixels wide (the Google Docs sidebar is 300). */

.oz {
  --oz-bg: #f4f8fc;
  --oz-paper: #ffffff;
  --oz-ink: #1c2b3a;
  --oz-ink-soft: #3e5164;
  --oz-muted: #5e6e7e;
  --oz-line: #d3e2f1;
  --oz-line-soft: #e4eef8;
  --oz-accent: #a7c7e7;
  --oz-accent-hover: #93b9df;
  --oz-accent-strong: #6fa3d6;
  --oz-accent-deep: #2e5f8f;
  --oz-accent-wash: #eaf3fb;
  --oz-focus: #4a86c5;
  --oz-sheet: #ffffff;
  --oz-fold: #c0569b;
  --oz-ok: #2f6b3a;
  --oz-ok-wash: #e7f3e9;
  --oz-warn: #8a5300;
  --oz-warn-wash: #fff6e6;
  --oz-warn-line: #e9c27a;
  --oz-error: #b3261e;
  --oz-display: "Cormorant Garamond", "Offizin Display", Garamond, Georgia, serif;
  --oz-ui: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;

  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  background: var(--oz-bg);
  color: var(--oz-ink);
  font: 13px/1.45 var(--oz-ui);
  box-sizing: border-box;
  accent-color: var(--oz-accent-deep);
}
.oz *, .oz *::before, .oz *::after { box-sizing: border-box; }
.oz [hidden] { display: none !important; }
.oz.oz-busy { cursor: progress; }
.oz.oz-busy .oz-body { opacity: 0.75; pointer-events: none; }

/* Header, with Offizin's own Undo, Redo, and history */
.oz-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px 14px; }
.oz-mark svg { display: block; width: 26px; height: 26px; }
.oz-wordmark { font-family: var(--oz-display); font-style: italic; font-weight: 500; font-size: 24px; line-height: 1; letter-spacing: 0.01em; }
.oz-hist-btns { display: inline-flex; gap: 2px; margin-left: auto; }
.oz-icon {
  position: relative; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0;
  border: 1px solid transparent; border-radius: 6px; background: none; color: var(--oz-ink-soft); cursor: pointer;
}
.oz-icon:hover:not(:disabled) { background: var(--oz-accent-wash); border-color: var(--oz-line); color: var(--oz-ink); }
.oz-icon:disabled { opacity: 0.38; cursor: default; }
.oz-icon[aria-expanded="true"] { background: var(--oz-accent-wash); border-color: var(--oz-accent-strong); color: var(--oz-ink); }
.oz-count {
  position: absolute; top: -3px; right: -3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  background: var(--oz-accent-deep); color: #fff; font: 700 10px/16px var(--oz-ui); text-align: center;
}

.oz-confirm { margin: 0 10px 8px; padding: 9px 11px; border: 1px solid var(--oz-warn-line); border-left-width: 4px; border-radius: 6px; background: var(--oz-warn-wash); font-size: 12.5px; }
.oz-confirm p { margin: 0 0 6px; }
.oz-confirm-title { font-weight: 700; color: var(--oz-warn); }

.oz-history { margin: 0 10px 8px; padding: 10px 12px; max-height: 50vh; overflow-y: auto; border: 1px solid var(--oz-line); border-radius: 8px; background: var(--oz-paper); box-shadow: 0 6px 18px rgba(28, 43, 58, 0.08); }
.oz-history-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.oz-history-head span { font-size: 11.5px; color: var(--oz-muted); }
.oz-hist { list-style: none; margin: 6px 0 8px; padding: 0; border-left: 2px solid var(--oz-line); }
.oz-hist li { position: relative; margin: 0 0 2px; padding-left: 10px; }
.oz-hist li::before { content: ""; position: absolute; left: -6px; top: 11px; width: 10px; height: 10px; border-radius: 50%; background: var(--oz-paper); border: 2px solid var(--oz-accent-strong); }
.oz-hist li.oz-undone::before { border-style: dashed; border-color: var(--oz-line); }
.oz-hist li.oz-start::before { border-color: var(--oz-muted); }
.oz-hist li.oz-here::before { background: var(--oz-accent-deep); border-color: var(--oz-accent-deep); }
.oz-hist button[data-jump] {
  display: flex; flex-direction: column; align-items: flex-start; width: 100%; padding: 5px 8px; border: 1px solid transparent; border-radius: 6px;
  background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.oz-hist button[data-jump]:hover:not(:disabled) { background: var(--oz-accent-wash); }
.oz-hist li.oz-here button[data-jump] { background: var(--oz-accent-wash); border-color: var(--oz-accent); }
.oz-hist-label { font-weight: 600; font-size: 12.5px; line-height: 1.3; }
.oz-hist li.oz-undone .oz-hist-label { color: var(--oz-muted); font-weight: 500; }
.oz-hist-meta { font-size: 11px; color: var(--oz-muted); }
.oz-hist-fail { display: block; padding: 2px 8px 4px; font-size: 11.5px; color: var(--oz-error); }

.oz-tabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--oz-line); }
.oz-tabs button {
  flex: 1 1 0; min-width: 0; padding: 8px 2px 7px; border: 0; background: none; color: var(--oz-ink-soft);
  font: 600 12px var(--oz-ui); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.oz-tabs button[aria-selected="true"] { color: var(--oz-ink); border-bottom-color: var(--oz-accent-strong); }
.oz-tabs button:hover { color: var(--oz-ink); }

.oz-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 14px 18px; }
.oz-body:focus { outline: none; }

.oz-foot { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-top: 1px solid var(--oz-line); background: var(--oz-paper); font-size: 12px; }
.oz-status { flex: 1; min-width: 0; color: var(--oz-muted); }
.oz-status[data-kind="success"] { color: var(--oz-ok); }
.oz-status[data-kind="error"] { color: var(--oz-error); }
.oz-status[data-kind="busy"] { color: var(--oz-accent-deep); }
.oz-host { flex: none; font-size: 11px; color: var(--oz-muted); white-space: nowrap; }
.oz-help { flex: none; color: var(--oz-accent-deep); }

.oz :focus-visible { outline: 2px solid var(--oz-focus); outline-offset: 2px; }

.oz-h { margin: 18px 0 8px; font: 600 12px var(--oz-ui); text-transform: uppercase; letter-spacing: 0.06em; color: var(--oz-ink-soft); }
.oz-h:first-child { margin-top: 2px; }
.oz-title { margin: 6px 0 4px; font-family: var(--oz-display); font-style: italic; font-weight: 500; font-size: 26px; line-height: 1.1; }
.oz-muted { color: var(--oz-muted); margin: 0 0 10px; }
.oz-meta { margin: -4px 0 10px; font-size: 12px; color: var(--oz-accent-deep); }
.oz-note { font-size: 12px; color: var(--oz-muted); margin: 8px 0 0; }
.oz-help-text { display: block; font-size: 11.5px; line-height: 1.35; color: var(--oz-muted); margin-top: 2px; }
.oz-strong { font-weight: 600; margin: 10px 0 4px; }
.oz-tip { font-size: 12px; color: var(--oz-ink-soft); background: var(--oz-accent-wash); padding: 8px 10px; border-radius: 6px; margin: 12px 0; }
.oz-ok { color: var(--oz-ok); font-weight: 600; }
.oz-ok-text { color: var(--oz-ok); font-weight: 600; margin: 0 0 4px; }
.oz-warn-text { color: var(--oz-warn); font-weight: 600; margin: 4px 0; }
.oz-empty { padding: 12px 0; grid-column: 1 / -1; }

/* Controls */
.oz-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 6px 12px;
  border: 1px solid var(--oz-line); border-radius: 6px; background: var(--oz-paper); color: var(--oz-ink);
  font: 600 12.5px var(--oz-ui); cursor: pointer; text-decoration: none;
}
.oz-btn:hover { border-color: var(--oz-accent-strong); }
.oz-btn:disabled { opacity: 0.5; cursor: default; }
.oz-primary { background: var(--oz-accent); color: var(--oz-ink); border-color: var(--oz-accent); }
.oz-primary:hover { background: var(--oz-accent-hover); border-color: var(--oz-accent-hover); }
.oz-danger { background: var(--oz-error); border-color: var(--oz-error); color: #fff; }
.oz-danger:hover { background: #962019; border-color: #962019; }
.oz-wide { width: 100%; margin-top: 6px; }
.oz-small { min-height: 28px; padding: 4px 9px; font-size: 12px; }
.oz-btns { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.oz-file { position: relative; overflow: hidden; }
.oz-file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
/* The file input is invisible, so keyboard focus on it shows on the button around it. */
.oz-file:focus-within { outline: 2px solid var(--oz-focus); outline-offset: 2px; }
.oz-link { border: 0; background: none; padding: 0; color: var(--oz-accent-deep); font: 600 12px var(--oz-ui); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.oz-reset-all { display: block; margin: 2px 0 14px; }

.oz-field { display: flex; flex-direction: column; gap: 3px; margin: 0 0 9px; }
.oz-field > span:first-child { font-size: 12px; font-weight: 600; color: var(--oz-ink-soft); }
.oz input[type="text"], .oz input[type="number"], .oz input[type="search"], .oz select, .oz textarea {
  width: 100%; min-height: 32px; padding: 5px 8px; border: 1px solid var(--oz-line); border-radius: 6px;
  background: var(--oz-paper); color: var(--oz-ink); font: 13px var(--oz-ui);
}
.oz input::placeholder, .oz textarea::placeholder { color: #93a3b3; }
.oz-field-inline { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--oz-ink-soft); }
.oz-field-inline select { width: auto; max-width: 150px; min-height: 28px; padding: 3px 6px; font-size: 12px; }
.oz-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.oz-toolbar .oz-search { flex: 1 1 100%; }
.oz-seg { display: inline-flex; align-self: flex-start; border: 1px solid var(--oz-line); border-radius: 6px; overflow: hidden; }
.oz-seg button { border: 0; background: var(--oz-paper); padding: 4px 10px; font: 600 12px var(--oz-ui); color: var(--oz-ink-soft); cursor: pointer; }
.oz-seg button + button { border-left: 1px solid var(--oz-line); }
.oz-seg button[aria-pressed="true"] { background: var(--oz-accent); color: var(--oz-ink); }
.oz-row2 { display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap; }
.oz-row2 .oz-field { flex: 1 1 120px; }
.oz-row2 .oz-btns { margin-bottom: 9px; }
.oz-check { display: inline-flex; align-items: flex-start; gap: 6px; margin: 2px 0 8px; font-size: 12.5px; line-height: 1.35; }
.oz-check input { margin: 2px 0 0; flex: none; }
.oz-margins { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; margin-bottom: 6px; }
.oz-mini { display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--oz-ink-soft); }
.oz-newset { padding: 8px 10px; margin-bottom: 10px; border: 1px dashed var(--oz-accent-strong); border-radius: 6px; background: var(--oz-paper); }
.oz-chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 4px; }
.oz-chip { padding: 3px 9px; border: 1px solid var(--oz-line); border-radius: 999px; background: var(--oz-paper); color: var(--oz-ink-soft); font: 600 11.5px var(--oz-ui); cursor: pointer; }
.oz-chip:hover { border-color: var(--oz-accent-strong); }
.oz-chip[aria-pressed="true"] { background: var(--oz-accent-wash); border-color: var(--oz-accent-deep); color: var(--oz-ink); }

/* Sliders */
.oz-slider { margin: 0 0 10px; }
.oz-slider label { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 600; color: var(--oz-ink-soft); }
.oz-slider output { font-variant-numeric: tabular-nums; color: var(--oz-accent-deep); }
.oz-slider input[type="range"] { display: block; width: 100%; margin: 4px 0 0; }

/* Collapsible sections in the publication detail */
.oz-sec { margin: 0 0 8px; border: 1px solid var(--oz-line); border-radius: 8px; background: var(--oz-paper); }
.oz-sec > summary { display: flex; align-items: center; gap: 8px; padding: 9px 10px; cursor: pointer; list-style: none; }
.oz-sec > summary::-webkit-details-marker { display: none; }
.oz-sec > summary::before {
  content: ""; flex: none; width: 7px; height: 7px; margin: 0 2px 2px 1px; border-right: 2px solid var(--oz-ink-soft); border-bottom: 2px solid var(--oz-ink-soft);
  transform: rotate(-45deg); transition: transform 0.15s ease;
}
.oz-sec[open] > summary::before { transform: rotate(45deg); margin-bottom: 4px; }
.oz-sec-title { font-weight: 600; font-size: 12.5px; }
.oz-sec-meta { margin-left: auto; font-size: 11.5px; color: var(--oz-muted); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oz-sec-body { padding: 2px 10px 10px; border-top: 1px solid var(--oz-line-soft); }
.oz-sec-body > :first-child { margin-top: 8px; }

/* Print settings */
.oz-print { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; margin: 8px 0; font-size: 12px; }
.oz-print dt { font-weight: 600; color: var(--oz-ink-soft); }
.oz-print dd { margin: 0; }
.oz-toggle { margin: 6px 0 8px; }
.oz-toggle .oz-check { margin-bottom: 0; font-weight: 600; }
.oz-toggle .oz-help-text { padding-left: 20px; }

/* Mail merge */
.oz-merge-text { min-height: 110px; resize: vertical; font: 11.5px/1.45 ui-monospace, Menlo, Consolas, monospace !important; white-space: pre; overflow-wrap: normal; overflow-x: auto; tab-size: 14; }
.oz-merge-status { margin: 6px 0 8px; font-size: 12px; }
.oz-merge-status p { margin: 0 0 4px; }
.oz-merge-rows { margin: 4px 0 0; padding-left: 18px; font-size: 11.5px; color: var(--oz-ink-soft); }
.oz-merge-rows li { overflow-wrap: anywhere; }
.oz-merge-rows .oz-more { list-style: none; margin-left: -18px; color: var(--oz-muted); }

/* Gallery */
.oz-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.oz-card {
  display: flex; flex-direction: column; align-items: stretch; gap: 2px; padding: 8px; text-align: left;
  border: 1px solid var(--oz-line); border-radius: 8px; background: var(--oz-paper); cursor: pointer; color: inherit; font: inherit;
}
.oz-card:hover { border-color: var(--oz-accent-strong); box-shadow: 0 2px 8px rgba(28, 43, 58, 0.08); }
.oz-thumb { display: flex; align-items: center; justify-content: center; height: 112px; margin-bottom: 6px; background: #eaf2fa; border-radius: 4px; overflow: hidden; pointer-events: none; }
.oz-thumb .ozp-sheet { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); }
.oz-card-name { font-weight: 600; font-size: 12.5px; line-height: 1.25; }
.oz-card-meta { font-size: 11px; color: var(--oz-muted); line-height: 1.3; }
.oz-tag { display: inline-block; align-self: flex-start; margin-top: 4px; padding: 1px 7px; border-radius: 999px; background: var(--oz-ok-wash); color: var(--oz-ok); font: 700 10.5px/1.6 var(--oz-ui); letter-spacing: 0.02em; }
.oz-tags { margin: 0 0 6px; }
.oz-tags .oz-tag { margin: 0 4px 0 0; }
.oz-tags .oz-note { margin: 0; }

.oz-back { border: 0; background: none; padding: 0; color: var(--oz-accent-deep); font: 600 12.5px var(--oz-ui); cursor: pointer; }
.oz-large { padding: 12px 0; margin: 6px 0 4px; background: #e6f0fa; border-radius: 6px; }
.oz-preview-note { margin: 0 0 10px; font-size: 11.5px; color: var(--oz-muted); }
.oz-preview-note[data-kind="warn"] { padding: 6px 9px; border-radius: 6px; background: var(--oz-warn-wash); color: var(--oz-warn); font-weight: 600; }
.oz-fit { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: -4px 0 12px; }
.oz-fit .oz-help-text { flex: 1 1 150px; margin: 0; }
.oz-options { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 0 8px; }
.oz-options .oz-span { grid-column: 1 / -1; }
.oz-modes { border: 1px solid var(--oz-line); border-radius: 6px; padding: 6px 10px 4px; margin: 4px 0 8px; }
.oz-modes legend { font-size: 12px; font-weight: 600; color: var(--oz-ink-soft); padding: 0 4px; }
.oz-radio { display: flex; align-items: center; gap: 6px; margin: 4px 0; }

/* Design */
.oz-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.oz-swatch { display: flex; flex-direction: column; gap: 4px; padding: 6px; border: 1px solid var(--oz-line); border-radius: 6px; background: var(--oz-paper); cursor: pointer; font: inherit; color: inherit; }
.oz-swatch[aria-pressed="true"], .oz-fontopt[aria-pressed="true"] { border-color: var(--oz-accent-deep); box-shadow: inset 0 0 0 1px var(--oz-accent-deep); background: var(--oz-accent-wash); }
.oz-chipset { display: flex; height: 18px; border-radius: 3px; overflow: hidden; }
.oz-chipset i { flex: 1; }
.oz-chipset i:first-child { flex: 2; }
.oz-swatch-name { font-size: 11px; line-height: 1.2; text-align: left; }
.oz-custom { margin-top: 8px; }
.oz-custom summary { cursor: pointer; font-weight: 600; font-size: 12.5px; color: var(--oz-accent-deep); margin-bottom: 6px; }
.oz-color { display: grid; grid-template-columns: 1fr 40px 86px; align-items: center; gap: 6px; margin-top: 6px; font-size: 12.5px; }
.oz-color input[type="color"] { width: 40px; height: 30px; padding: 0; border: 1px solid var(--oz-line); border-radius: 6px; background: none; }
.oz-fontlist { display: grid; gap: 6px; }
.oz-fontopt { display: flex; flex-direction: column; align-items: flex-start; padding: 7px 10px; border: 1px solid var(--oz-line); border-radius: 6px; background: var(--oz-paper); cursor: pointer; color: inherit; text-align: left; }
.oz-fontname { font-size: 18px; line-height: 1.2; }
.oz-fontmeta { font-size: 11.5px; color: var(--oz-muted); }

/* Insert */
.oz-parts { display: grid; gap: 6px; }
.oz-part { display: flex; gap: 10px; align-items: center; padding: 7px; border: 1px solid var(--oz-line); border-radius: 6px; background: var(--oz-paper); text-align: left; cursor: pointer; color: inherit; font: inherit; }
.oz-part:hover { border-color: var(--oz-accent-strong); }
.oz-part-prev { flex: none; position: relative; width: 84px; height: 56px; overflow: hidden; background: #fff; border: 1px solid #e1ecf7; border-radius: 3px; pointer-events: none; }
.oz-part-scale { position: absolute; top: 4px; left: 0; transform-origin: 0 0; padding: 0 6pt; }
.oz-part-text { display: flex; flex-direction: column; min-width: 0; }
.oz-part-text strong { font-size: 12.5px; }
.oz-part-text span { font-size: 11.5px; color: var(--oz-muted); line-height: 1.3; }

/* Info */
.oz-logo { display: flex; align-items: center; min-height: 48px; padding: 6px; margin-bottom: 6px; border: 1px dashed var(--oz-line); border-radius: 6px; background: var(--oz-paper); }
.oz-logo img { max-height: 60px; max-width: 100%; }
.oz-export { min-height: 120px; margin-top: 8px; font: 11px ui-monospace, Menlo, Consolas, monospace !important; }

/* Check */
.oz-findings { list-style: none; padding: 0; margin: 10px 0 4px; display: grid; gap: 6px; }
.oz-findings li { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; padding: 7px 8px; background: var(--oz-paper); border: 1px solid var(--oz-line); border-radius: 6px; }
.oz-findings .oz-kind { grid-column: 1; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.oz-findings .oz-ftext { grid-column: 1; font-size: 12px; overflow-wrap: anywhere; }
.oz-findings .oz-btn { grid-column: 2; grid-row: 1 / span 2; }
.oz-kind-sample { color: #8a5a00; }
.oz-kind-picture { color: #5a4a8a; }
.oz-kind-info { color: #1f5f8b; }
.oz-kind-layout { color: var(--oz-error); }
.oz-diagram { background: var(--oz-paper); border: 1px solid var(--oz-line); border-radius: 6px; padding: 6px; }

  label: { font: "body", size: 7.5, bold: true, caps: true, line: 1.2, after: 2, color: "muted" },
  button: { font: "body", size: 11, bold: true, caps: true, line: 1.2, after: 0, color: "onAccent" },
};

/**
 * Native styles for each role. Word uses the style ID (built-in IDs for Title, Heading 1,
 * Heading 2, Normal, Quote, and Caption, so the Styles pane, Navigation pane, and screen
 * readers understand the document). Google Docs uses the named paragraph style.
 */
const ROLE_STYLES = {
  display: { word: "OffizinDisplay", name: "Offizin Display", google: "TITLE" },
  title: { word: "Title", name: "Title", google: "TITLE" },
  headline: { word: "Heading1", name: "heading 1", google: "HEADING1" },
  h1: { word: "Heading1", name: "heading 1", google: "HEADING1" },
  h2: { word: "Heading2", name: "heading 2", google: "HEADING2" },
  kicker: { word: "OffizinKicker", name: "Offizin Kicker", google: "NORMAL" },
  lead: { word: "OffizinLead", name: "Offizin Lead", google: "SUBTITLE" },
  body: { word: "Normal", name: "Normal", google: "NORMAL" },
  small: { word: "OffizinSmall", name: "Offizin Small", google: "NORMAL" },
  caption: { word: "Caption", name: "caption", google: "NORMAL" },
  quote: { word: "Quote", name: "Quote", google: "NORMAL" },
  label: { word: "OffizinLabel", name: "Offizin Label", google: "NORMAL" },
  button: { word: "OffizinButton", name: "Offizin Button", google: "NORMAL" },
};

/** Business information, in the spirit of Publisher's business information sets. */
const BUSINESS_FIELDS = [
  { key: "name", label: "Your name", sample: "Jordan Rivera" },
  { key: "title", label: "Job title", sample: "Program Director" },
  { key: "org", label: "Organization", sample: "Riverside Arts Collective" },
  { key: "tagline", label: "Tagline or motto", sample: "Creating together since 1998" },
  { key: "address", label: "Street address", sample: "123 Main Street" },
  { key: "city", label: "City, state, and postal code", sample: "Springfield, ST 12345" },
  { key: "phone", label: "Phone", sample: "(555) 123-4567" },
  { key: "email", label: "Email", sample: "hello@example.org" },
  { key: "web", label: "Website", sample: "www.example.org" },
  { key: "social", label: "Social media", sample: "@riversidearts" },
  { key: "profile", label: "LinkedIn or portfolio link", sample: "linkedin.com/in/jordanrivera" },
];

/**
 * Spacing and text controls. Each is a multiplier (1 = the template's design).
 *   textScale   font sizes          lineScale   line spacing
 *   spaceScale  space between paragraphs and blocks
 *   padScale    padding inside panels, boxes, and cells
 *   gapScale    gaps between columns
 */
const DEFAULT_LAYOUT = { textScale: 1, lineScale: 1, spaceScale: 1, padScale: 1, gapScale: 1 };
const LAYOUT_LIMITS = {
  textScale: [0.7, 1.5],
  lineScale: [0.8, 1.8],
  spaceScale: [0, 3],
  padScale: [0, 3],
  gapScale: [0, 3],
};

/** Print settings carried by every model. Renderers apply what their editor supports. */
const DEFAULT_PRINT = {
  duplex: "none", // "none", "long" (flip on long edge), or "short" (flip on short edge)
  scale: 100, // always print at actual size
  bookFold: false, // Word prints the pages as a folded booklet (imposition done by Word)
  mirrorMargins: false, // inside and outside margins for facing pages
  gutter: 0, // extra binding margin in points
  twoPerSheet: false, // Word prints two pages on each sheet
  embedFonts: false, // Word for Windows embeds fonts when the file is saved
  paper: "", // a plain-language paper suggestion
  finishing: "", // cutting, folding, or binding notes
};

const DEFAULT_THEME = {
  colorScheme: "ink",
  customColors: null, // { primary, accent, dark } when the user picks their own
  fontScheme: "typewriter",
  customFonts: null, // { heading: { word, google }, body: { word, google }, headingBold } with fontScheme "custom"
  paper: "letter", // "letter" or "a4"
  business: {},
  logo: null, // { src: dataURL, width, height } in pixels
  layout: DEFAULT_LAYOUT,
};

/** What the Customize panel may change for a template. */
function customizeFor(template) {
  const c = template.customize || {};
  return {
    paper: c.paper === false ? null : c.paper || null, // a list of PAPER keys, or null for Letter/A4 only
    orientation: !!c.orientation,
    margins: c.margins !== false,
    spacing: c.spacing !== false,
    text: c.text !== false,
  };
}

/** The three chosen colors for a theme, from a named scheme or custom colors. */
function themeColors(theme) {
  if (theme.colorScheme === "custom" && theme.customColors) return theme.customColors;
  return findColorScheme(theme.colorScheme);
}

/** Field values with samples filled in, plus the list of fields that used samples. */
function businessValues(business = {}) {
  const values = {};
  const missing = [];
  for (const f of BUSINESS_FIELDS) {
    const v = String(business[f.key] || "").trim();
    values[f.key] = v || f.sample;
    if (!v) missing.push(f.key);
  }
  return { values, missing };
}

function normMargins(m) {
  if (typeof m === "number") return { top: m, right: m, bottom: m, left: m };
  return { top: Number(m.top) || 0, right: Number(m.right) || 0, bottom: Number(m.bottom) || 0, left: Number(m.left) || 0 };
}

function clampLayout(layout = {}) {
  const out = {};
  for (const [k, [lo, hi]] of Object.entries(LAYOUT_LIMITS)) {
    const v = Number(layout[k]);
    out[k] = Number.isFinite(v) ? clamp(v, lo, hi) : DEFAULT_LAYOUT[k];
  }
  return out;
}

/** Resolves a template's page for the chosen paper and any Customize overrides. */
function resolvePage(template, paper, options = {}) {
  const spec = typeof template.page === "function" ? template.page(paper, options) : template.page;
  const allow = customizeFor(template);
  let sizeName = spec.size === "paper" || !spec.size ? paper : spec.size;
  if (options.paperSize && allow.paper && allow.paper.includes(options.paperSize)) sizeName = options.paperSize;
  let orientation = spec.orientation || "portrait";
  if (allow.orientation && (options.orientation === "portrait" || options.orientation === "landscape")) orientation = options.orientation;
  const size = spec.width ? { width: spec.width, height: spec.height } : pageSize(sizeName, orientation);
  let margins = normMargins(spec.margins ?? 36);
  if (options.margins && allow.margins) {
    const m = normMargins(options.margins);
    // Keep at least two inches of usable space in each direction.
    let maxSide = Math.max(0, (size.width - 144) / 2);
    // A tri-fold also keeps each outer panel at least one inch wide.
    if (template.fold === "trifold") maxSide = Math.max(0, Math.min(maxSide, size.width / 3 - 72));
    const maxTop = Math.max(0, (size.height - 144) / 2);
    margins = {
      top: round(clamp(m.top, 0, maxTop)),
      bottom: round(clamp(m.bottom, 0, maxTop)),
      left: round(clamp(m.left, 0, maxSide)),
      right: round(clamp(m.right, 0, maxSide)),
    };
  }
  return {
    width: round(size.width),
    height: round(size.height),
    orientation: size.width > size.height ? "landscape" : "portrait",
    margins,
    sizeName: spec.width ? null : sizeName,
  };
}

/** Cleans merge records: plain string values, at most 1000 records. */
function normalizeRecords(records) {
  if (!Array.isArray(records)) return [];
  return records.slice(0, 1000).map((r) => {
    const out = {};
    for (const [k, v] of Object.entries(r || {})) out[String(k)] = v == null ? "" : String(v).trim();
    return out;
  });
}

/** The standard paper size a sheet matches in either orientation (within about 1.5 mm), or null. */
function matchPaperSize(width, height) {
  const near = (a, b) => Math.abs(a - b) < 4.5;
  for (const [name, p] of Object.entries(PAPER)) {
    if (near(p.width, width) && near(p.height, height)) return { name, width: p.width, height: p.height };
    if (near(p.height, width) && near(p.width, height)) return { name, width: p.height, height: p.width };
  }
  return null;
}

/**
 * The sheet that holds two portrait pages side by side (booklets, and two pages per sheet),
 * snapped to standard paper: two A5 pages are 296 mm wide, and the sheet is A4 at 297 mm.
 * Returns { width, height, sizeName } or null for a landscape page.
 */
function twoUpSheet(page) {
  if (!page || page.width > page.height) return null;
  const width = round(page.width * 2);
  const match = matchPaperSize(width, page.height);
  if (!match) return null;
  return { width: round(match.width), height: round(match.height), sizeName: match.name };
}

/** The page size Word stores for a model: the whole sheet for book fold and for two pages per sheet. */
function wordSheet(model, bookFold) {
  if (bookFold && model.booklet) return { width: model.booklet.sheet.width, height: model.booklet.sheet.height };
  if (model.print && model.print.twoPerSheet && !model.booklet) {
    const sheet = twoUpSheet(model.page);
    if (sheet) return { width: sheet.width, height: sheet.height };
  }
  return { width: model.page.width, height: model.page.height };
}

/** Printer spread order for a booklet of n pages (n is a multiple of 4), as [left, right] page indexes. */
function bookletSpreads(n) {
  const spreads = [];
  for (let s = 0; s < n / 4; s++) {
    spreads.push([n - 1 - 2 * s, 2 * s]); // front of sheet s
    spreads.push([2 * s + 1, n - 2 - 2 * s]); // back of sheet s
  }
  return spreads;
}

// ---------------------------------------------------------------------------
// Composition
// ---------------------------------------------------------------------------

/** Fill tokens that are always light, so accent text on them uses its darker text tone. */
const LIGHT_FILLS = new Set(["white", "tint", "accentTint", "line"]);

class Composer {
  constructor(theme, platform, layout) {
    this.theme = { ...DEFAULT_THEME, ...theme };
    this.platform = platform;
    this.layout = clampLayout(layout || this.theme.layout);
    this.colors = palette(themeColors(this.theme));
    this.fontScheme = findFontScheme(this.theme.fontScheme, this.theme.customFonts);
    this.fonts = fontsFor(this.fontScheme, platform);
    const { values, missing } = businessValues(this.theme.business);
    this.info = values;
    this.missingInfo = missing;
    this.samples = new Set();
    this.vars = {};
    // The fill tokens of the cells being composed, innermost last, so text can pick a readable tone.
    this.backgrounds = [];
    // A template's own look for some roles (see template.styles in compose()).
    this.styleOverrides = {};
  }

  /**
   * The color for text. Text in the accent color uses the accent's darker text tone on paper and
   * light fills, and the accent itself on other fills. The choice goes by the fill's token, not
   * its value, so a publication restyled to another scheme matches one made in that scheme.
   */
  textColor(token, fallback) {
    if ((token || fallback) !== "accent") return this.color(token, fallback);
    const fill = this.backgrounds[this.backgrounds.length - 1];
    const light = fill === undefined || (typeof fill === "string" && !fill.startsWith("#") ? LIGHT_FILLS.has(fill) : contrastRatio(this.color(fill), "#FFFFFF") < 2);
    return this.color(light ? "accentText" : "accent");
  }

  color(token, fallback = "dark") {
    if (!token) token = fallback;
    if (typeof token === "string" && token.startsWith("#")) return token.toUpperCase();
    if (typeof token === "object" && token.mix) {
      return mix(this.color(token.mix[0]), this.color(token.mix[1]), token.mix[2]);
    }
    return this.colors[token] || this.colors[fallback];
  }

  size(pt) {
    return Math.max(4, Math.round(pt * this.layout.textScale * 2) / 2);
  }

  space(pt) {
    return round((pt || 0) * this.layout.spaceScale, 1);
  }

  /** Replaces {field} tokens with merge values, template variables, or business information. */
  fill(text) {
    return String(text).replace(/\{(\w+)\}/g, (m, key) => {
      if (key in this.vars) return String(this.vars[key]);
      if (key in this.info) return this.info[key];
      return m;
    });
  }

  /**
   * Remembers sample text, so the design checker can find what is still unreplaced. Short text
   * is skipped unless it is known to be a sample: marked { sample: true }, marked { fixed: false }
   * (the sample records in mail merge templates), or a placeholder such as "Job title".
   */
  recordSample(raw, block, caps) {
    if (block.fixed) return;
    if (/\{\w+\}/.test(raw)) return;
    // Search one line at a time and stop at a tab, since neither is a space in the editors.
    const firstLine = String(raw).split("\n")[0].split("\t")[0];
    // Keep double spaces: the editors keep them, so the search has to as well.
    let clean = firstLine.replace(/\*\*/g, "").trim();
    if (!/[a-z]/i.test(clean)) return;
    const known = block.sample === true || block.fixed === false || /\S\s+(name|title)$/i.test(clean);
    if (clean.length < (known ? 3 : 12)) return;
    // Text styled in capitals is written in capitals, and the editors search with matching case.
    if (caps) clean = clean.toUpperCase();
    // The checker searches for the start of each sample, which keeps searches short and reliable.
    this.samples.add(clean.slice(0, 48).trim());
  }

  /** "**bold** text" becomes runs. */
  runs(text, caps) {
    const out = [];
    const parts = String(text).split(/(\*\*[^*]+\*\*)/g);
    for (const part of parts) {
      if (!part) continue;
      const bold = part.startsWith("**") && part.endsWith("**");
      let t = bold ? part.slice(2, -2) : part;
      if (caps) t = t.toUpperCase();
      out.push(bold ? { text: t, bold: true } : { text: t });
    }
    return out.length ? out : [{ text: "" }];
  }

  /** The default look of one role, after the theme and the text controls. */
  roleStyle(roleName) {
    const role = ROLES[roleName] || ROLES.body;
    const font = this.fonts[role.font];
    const isHeading = role.font === "heading";
    const caps = !!role.caps;
    return {
      role: roleName,
      word: ROLE_STYLES[roleName].word,
      wordName: ROLE_STYLES[roleName].name,
      google: ROLE_STYLES[roleName].google,
      fontKey: role.font,
      font: font.name,
      css: font.css,
      size: this.size(role.size),
      color: this.textColor(role.color),
      bold: role.bold ? (isHeading ? this.fonts.headingBold : true) : false,
      italic: !!role.italic,
      caps,
      tracking: caps ? 0.08 : 0,
      line: round(role.line * this.layout.lineScale, 3),
      before: 0,
      after: this.space(role.after),
      ...this.overrideFor(roleName),
    };
  }

  /**
   * A template's own size, color, and spacing for a role, scaled the same way as paragraphs, so
   * paragraphs that use it match their style exactly and carry no direct formatting in Word.
   */
  overrideFor(roleName) {
    const o = this.styleOverrides[roleName];
    if (!o) return {};
    const out = {};
    if (o.size !== undefined) out.size = this.size(o.size);
    if (o.color !== undefined) out.color = this.textColor(o.color);
    if (o.before !== undefined) out.before = this.space(o.before);
    if (o.after !== undefined) out.after = this.space(o.after);
    if (o.line !== undefined) out.line = round(Math.max(0.8, o.line * this.layout.lineScale), 3);
    return out;
  }

  styles() {
    const out = {};
    for (const r of Object.keys(ROLES)) out[r] = this.roleStyle(r);
    return out;
  }

  paragraph(b, extra = {}) {
    const roleName = ROLES[b.role] ? b.role : "body";
    const role = ROLES[roleName];
    const fontKey = b.font || role.font;
    const font = this.fonts[fontKey];
    const isHeading = fontKey === "heading";
    const bold = b.bold ?? (role.bold ? (isHeading ? this.fonts.headingBold : true) : false);
    const raw = b.text ?? "";
    const caps = b.caps ?? role.caps ?? false;
    this.recordSample(raw, b, caps);
    const p = {
      t: "p",
      style: roleName,
      runs: this.runs(this.fill(raw), caps),
      font: font.name,
      css: font.css,
      size: this.size(b.size ?? role.size),
      color: this.textColor(b.color, role.color),
      bold,
      italic: b.italic ?? role.italic ?? false,
      align: b.align || "left",
      before: this.space(b.before ?? 0),
      after: this.space(b.after ?? role.after),
      line: round(Math.max(0.8, (b.line ?? role.line) * this.layout.lineScale), 3),
      tracking: b.tracking ?? (caps ? 0.08 : 0),
      caps: !!caps,
      ...extra,
    };
    if (b.indent) p.indent = { left: Number(b.indent.left) || 0, hanging: Number(b.indent.hanging) || 0 };
    if (b.keepNext) p.keepNext = true;
    return p;
  }

  /** Resolves a list of template blocks for a container `width` points wide. */
  blocks(list, width) {
    const out = [];
    for (const b of list.flat(Infinity)) {
      if (!b) continue;
      switch (b.t) {
        case "p":
          out.push(this.paragraph(b));
          break;
        case "list": {
          const indent = b.indent ?? 12;
          b.items.forEach((item, i) => {
            const last = i === b.items.length - 1;
            out.push(
              this.paragraph(
                { ...b, t: "p", text: item, indent: undefined, after: last ? (b.after ?? 6) : (b.gap ?? 3) },
                { bullet: { char: b.bullet || "•", color: this.color(b.bulletColor || "accent"), indent } }
              )
            );
          });
          break;
        }
        case "rule":
          out.push({
            t: "rule",
            color: this.color(b.color || "line"),
            weight: b.weight ?? 1,
            before: this.space(b.before ?? 4),
            after: this.space(b.after ?? 8),
            width: round(b.width ? Math.min(b.width, width) : width),
            align: b.align || "left",
          });
          break;
        case "spacer":
          out.push({ t: "spacer", height: this.space(b.height ?? 12) });
          break;
        case "break":
          out.push({ t: "break" });
          break;
        case "image":
          out.push(this.image(b, width));
          break;
        case "band":
          out.push(this.band(b, width));
          break;
        case "table":
          out.push(this.table(b, width));
          break;
        case "grid":
          out.push(this.grid(b, width));
          break;
        case "columns":
          out.push(this.columns(b, width));
          break;
        case "scope": {
          const saved = this.vars;
          this.vars = { ...saved, ...b.vars };
          out.push(...this.blocks(b.blocks || [], width));
          this.vars = saved;
          break;
        }
        default:
          throw new Error("Unknown block type: " + b.t);
      }
    }
    return out;
  }

  image(b, width) {
    let w = b.width === "full" ? width : Math.min(b.width ?? width, width);
    let h = b.height ?? w * 0.66;
    const logo = b.kind === "logo" && this.theme.logo && this.theme.logo.src ? this.theme.logo : null;
    if (logo) {
      // Fit the logo inside the frame and keep its proportions.
      const ratio = logo.width / logo.height;
      if (w / h > ratio) w = h * ratio;
      else h = w / ratio;
    }
    return {
      t: "image",
      kind: b.kind || "photo",
      // Never a zero or negative size, which Word cannot open and Google Docs refuses.
      width: Math.max(1, round(w)),
      height: Math.max(1, round(h)),
      align: b.align || "left",
      label: logo ? "" : this.fill(b.label || (b.kind === "logo" ? "Your logo" : "Your picture")),
      fill: this.color(b.fill || "tint"),
      ink: this.color(b.ink || "primary"),
      src: logo ? logo.src : null,
      before: this.space(b.before ?? 0),
      after: this.space(b.after ?? 6),
      alt: logo ? "Logo" : "Offizin picture placeholder",
    };
  }

  band(b, width) {
    const w = b.width ? Math.min(b.width, width) : width;
    return this.grid(
      {
        t: "grid",
        widths: [w],
        abs: true,
        align: b.align || "center",
        rows: [{ height: b.height, exact: b.exact, cells: [{ blocks: b.blocks, fill: b.fill, pad: b.pad ?? 12, valign: b.valign || "middle", border: b.border }] }],
      },
      width
    );
  }

  table(b, width) {
    const head = {
      fill: b.headFill || "primary",
      pad: [5, 6, 5, 6],
      border: null,
    };
    const rows = [];
    if (b.header) {
      rows.push({
        cells: b.header.map((text) => ({ ...head, blocks: [{ t: "p", text, role: "label", color: b.headColor || "onPrimary", after: 0, fixed: true }] })),
      });
    }
    b.rows.forEach((r, i) => {
      rows.push({
        cells: r.map((text, c) => ({
          fill: b.zebra !== false && i % 2 === 1 ? "tint" : null,
          pad: [5, 6, 5, 6],
          border: { bottom: { color: "line", weight: 0.75 } },
          blocks: [{ t: "p", text, role: "small", after: 0, bold: c === 0 && b.firstBold ? true : undefined, color: c === 0 && b.firstColor ? b.firstColor : undefined }],
        })),
      });
    });
    return this.grid({ t: "grid", widths: b.widths || b.rows[0].map(() => 1), rows, align: b.align }, width);
  }

  cellBorder(border) {
    if (!border) return null;
    const side = (s) => (s ? { color: this.color(s.color || "line"), weight: s.weight ?? 0.75, style: s.style || "solid" } : null);
    if (border.all) {
      const s = side(border.all);
      return { top: s, right: s, bottom: s, left: s };
    }
    return { top: side(border.top), right: side(border.right), bottom: side(border.bottom), left: side(border.left) };
  }

  grid(b, width) {
    const total = b.width ? Math.min(b.width, width) : width;
    // Sheet layouts (cards, labels) keep exact gaps so they line up with printed stock.
    const fixedGap = b.fixedGap || b.abs;
    const gap = (b.gap ?? 0) * (fixedGap ? 1 : this.layout.gapScale);
    const n = b.widths.length;
    let cols;
    if (b.abs) {
      cols = b.widths.slice();
    } else {
      const sum = b.widths.reduce((a, c) => a + c, 0);
      const avail = total - gap * (n - 1);
      cols = b.widths.map((f) => (f / sum) * avail);
    }
    cols = cols.map((c) => round(c));
    // Stop with a plain message, before anything reaches the document, if margins leave no room.
    if (cols.some((c) => !(c > 0))) throw new Error("This layout does not fit the page with these margins. Make the margins smaller under Customize, then try again.");
    const rows = b.rows.map((r) => {
      const row = Array.isArray(r) ? { cells: r } : r;
      const cells = [];
      row.cells.forEach((c, i) => {
        const raw = typeof (c.pad ?? 0) === "number" ? Array(4).fill(c.pad ?? 0) : c.pad;
        const pad = raw.map((v) => round(v * this.layout.padScale, 1));
        const inner = Math.max(12, cols[i] - pad[1] - pad[3]);
        if (c.fill) this.backgrounds.push(c.fill);
        const blocks = this.blocks(c.blocks || [], inner);
        if (c.fill) this.backgrounds.pop();
        cells.push({ fill: c.fill ? this.color(c.fill) : null, pad, valign: c.valign || "top", border: this.cellBorder(c.border ?? b.border), blocks });
        if (gap && i < row.cells.length - 1) cells.push({ fill: null, pad: [0, 0, 0, 0], valign: "top", border: null, blocks: [], spacer: true });
      });
      return { height: row.height ? round(row.height) : null, exact: !!row.exact, cells };
    });
    let widths = cols;
    if (gap) {
      widths = [];

/** The section name and builder for one entry of a booklet plan, such as "article2". */
function bookletPage(key) {
  const m = /^([a-z]+)(\d*)$/.exec(key);
  const kind = m[1];
  const n = m[2] === "" ? 0 : Number(m[2]);
  const def = BOOKLET_PAGES[kind];
  if (kind === "article") return { section: ARTICLES[n].section, title: ARTICLES[n].section, build: (ctx, i, plan, e) => def.build(ctx, i, plan, e, ARTICLES[n]) };
  if (kind === "schedule") return { section: SCHEDULES[n].section, title: SCHEDULES[n].title, build: (ctx, i, plan, e) => def.build(ctx, i, plan, e, SCHEDULES[n]) };
  if (kind === "profiles") return { section: n ? "Artists" : "Speakers", title: n ? "Meet this year's artists" : "Meet the speakers", build: (ctx, i, plan, e) => def.build(ctx, i, plan, e, n) };
  if (kind === "photos") return { section: "Snapshots", title: n ? "More moments" : "Snapshots", build: (ctx, i, plan, e) => def.build(ctx, i, plan, e, n) };
  return { section: def.section, title: def.section, build: def.build };
}

/** One certificate page, for a merge record or for the sample recipient. */
function certificatePage(ctx, r) {
  const recipient = r && r.recipient ? r.recipient : "Recipient Name";
  // A pasted list without a reason column leaves that line blank, as the merge status says.
  const reason = r ? r.reason || "" : alt(1, 6);
  const date = r && r.date ? r.date : "Date";
      const inner = [
        p("{org}", "kicker", { align: "center", after: 14 }),
        p("Certificate of Achievement", "title", { align: "center", size: 34 }),
        rule({ color: "accent", weight: 1.5, width: 80, align: "center", before: 4, after: 16 }),
        p("Presented to", "body", { align: "center", italic: true, color: "muted", after: 10 }),
        p(recipient, "display", { align: "center", size: 40, color: "accent", italic: true, after: reason ? 12 : 42, fixed: !!(r && r.recipient) }),
        reason ? p(reason, "body", { align: "center", size: 12, after: 30, fixed: !!(r && r.reason) }) : null,
        grid(
          [1, 0.3, 1],
          [
            [
              cell([rule({ color: "dark", weight: 0.75, before: 0, after: 4 }), p("{name}, {title}", "small", { align: "center", after: 0 })]),
              cell([]),
              cell([rule({ color: "dark", weight: 0.75, before: 0, after: 4 }), p(date, "small", { align: "center", after: 0, fixed: true })]),
            ],
          ],
          { width: round(ctx.W * 0.7) }
        ),
      ];
      return [
        grid(
          [ctx.W],
          [
            {
              height: ctx.H - 10,
              cells: [
                cell([grid([ctx.W - 16], [{ height: ctx.H - 26, cells: [cell(inner, { pad: 30, valign: "middle", border: { all: { color: "accent", weight: 1 } } })] }], { abs: true })], {
                  pad: 7,
                  border: { all: { color: "primary", weight: 4 } },
                }),
              ],
            },
          ],
          { abs: true }
        ),
      ];

}

        : { size: "paper", orientation: "portrait", margins: { top: 36, bottom: 36, left: 13.5, right: 13.5 } },
    folds: () => ({ vertical: [], horizontal: [], cut: true }),
    merge: {
      fields: [
        { key: "name", label: "Name", aliases: ["full name", "recipient", "addressee"] },
        { key: "company", label: "Company", aliases: ["organization", "organisation"] },
        { key: "address", label: "Street address", aliases: ["address 1", "address line 1", "street"] },
        { key: "address2", label: "Address line 2", aliases: ["apt", "suite", "unit", "address 2"] },
        { key: "city", label: "City", aliases: ["town", "city state zip"] },
        { key: "state", label: "State or region", aliases: ["province", "region", "county"] },
        { key: "postal", label: "Postal code", aliases: ["zip", "zip code", "postcode"] },
        { key: "country", label: "Country" },
      ],
      sample: [],
      note: "Paste a list to print one label per person. Leave it empty to print your own return address on every label.",
    },
    build(ctx) {
      const a4 = ctx.paper === "a4";
      const w = a4 ? round(mm(63.5)) : 189;
      const h = a4 ? round(mm(38.1)) : 72;
      const gap = a4 ? round(mm(2.54)) : 9;
      const down = a4 ? 7 : 10;
      const perSheet = down * 3;
      const returnLabel = () =>
        cell([p("{org}", "small", { bold: true, color: "primary", after: 1 }), p("{address}\n{city}", "small", { after: 0, line: 1.2 })], { pad: [4, 10, 4, 12], valign: "middle" });
      const mailLabel = (r) => {
        const place = [r.city, [r.state, r.postal].filter(Boolean).join(" ")].filter(Boolean).join(", ");
        const lines = [r.company, r.address, r.address2, place, r.country].filter(Boolean);
        // A Letter label is 1 inch tall, so a six-line address is set tighter there. The address stays at 8 pt or more.
        const tight = !a4 && lines.length > 4;
        return cell(
          [
            p(r.name || "", "small", { bold: true, color: "dark", after: 1, fixed: true, line: tight ? 1.1 : undefined }),
            lines.length ? p(lines.join("\n"), "small", { after: 0, line: tight ? 1 : 1.15, size: tight ? 8 : undefined, fixed: true }) : null,
          ],
          { pad: [4, 10, 4, 12], valign: "middle" }
        );
      };
      const sheet = (cells) => {
        const rows = [];
        for (let i = 0; i < down; i++) rows.push({ height: h, exact: true, cells: cells.slice(i * 3, i * 3 + 3) });
        return grid([w, w, w], rows, { abs: true, gap, align: "center" });
      };
      if (!ctx.hasRecords) return [sheet(Array.from({ length: perSheet }, returnLabel))];
      const out = [];
      chunk(ctx.records, perSheet).forEach((group, i) => {
        if (i) out.push(pageBreak());
        const cells = group.map(mailLabel);
        while (cells.length < perSheet) cells.push(cell([], { pad: 0 }));
        out.push(sheet(cells));
      });
      return out;
    },
  },

      {
        key: "weekStart",
        label: "Weeks start on",
        type: "select",
        choices: [
          { value: "sunday", label: "Sunday" },
          { value: "monday", label: "Monday" },
        ],
        default: "sunday",
      },
    ],
    build(ctx) {
      const month = Math.min(12, Math.max(1, Number(ctx.opt.month) || 1));
      const year = Number(ctx.opt.year) || new Date().getFullYear();
      ctx.setVar("calMonth", MONTHS[month - 1]);
      ctx.setVar("calYear", year);
      const startDay = ctx.opt.weekStart === "monday" ? 1 : 0;
      const first = (new Date(year, month - 1, 1).getDay() - startDay + 7) % 7;
      const dayNames = WEEKDAYS.slice(startDay).concat(WEEKDAYS.slice(0, startDay));
      const days = new Date(year, month, 0).getDate();
      const weeks = Math.ceil((first + days) / 7);
      const headerH = 62;
      const dayRowH = 20;
      const rowH = round((ctx.H - headerH - dayRowH - 16) / weeks);
      const border = { all: { color: "line", weight: 0.5 } };
      const rows = [
        { cells: dayNames.map((d) => cell([p(d, "label", { color: "onPrimary", align: "center", after: 0, fixed: true })], { fill: "primary", pad: 5 })) },
      ];
      let n = 1 - first;
      for (let wk = 0; wk < weeks; wk++) {
        const cells = [];
        for (let d = 0; d < 7; d++, n++) {
          const inMonth = n >= 1 && n <= days;
          const sunday = dayNames[d] === "Sunday";
          cells.push(cell(inMonth ? [p(String(n), "h2", { color: sunday ? "accent" : "dark", after: 0, size: 11, fixed: true })] : [], { pad: [4, 6, 4, 6], border, fill: inMonth ? null : "tint" }));
        }
        rows.push({ height: rowH, cells });
      }
      return [
        grid(
          [0.7, 0.3],
          [
            {
              height: headerH,
              cells: [
                cell([p("{calMonth} {calYear}", "display", { size: 38, after: 0 })], { valign: "bottom", pad: [0, 0, 8, 0] }),
                cell([brandMark(ctx, 120, 40, { align: "right", after: 0 }), p("{web}", "small", { align: "right", color: "muted", after: 0 })], { valign: "bottom", pad: [0, 0, 10, 0] }),
              ],
            },
          ]
        ),
        grid([1, 1, 1, 1, 1, 1, 1], rows),
      ];
    },
  },
